    if (!historyList || historyList.length < 5) return { pick: "BIG", targetNum: 7 };
    var numbers = historyList.map(function(item) { return parseInt(item.number); });
    var types = numbers.map(function(n) { return getType(n); });
    var scanData = numbers.slice(0, 10);
    var bigCount = scanData.filter(function(n) { return n >= 5; }).length;
    var smallCount = scanData.length - bigCount;
    var freq = {};
    scanData.forEach(function(n) { freq[n] = (freq[n] || 0) + 1; });
    var currentStreak = 1;
    for (var i = 0; i < types.length - 1; i++) {
        if (types[i] === types[i + 1]) { currentStreak++; } else { break; }
    }
    var decision = "BIG";
    if (currentStreak >= 4) { decision = (types[0] === "BIG") ? "SMALL" : "BIG"; }
    else if (currentStreak >= 2) { decision = types[0]; }
    else { decision = (bigCount > smallCount) ? "SMALL" : "BIG"; }
    if (isFlipped) { decision = (decision === "BIG") ? "SMALL" : "BIG"; }
    var candidatePool = (decision === "BIG") ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
    candidatePool.sort(function(a, b) { return (freq[a] || 0) - (freq[b] || 0); });
    return { pick: decision, targetNum: candidatePool[0] };
}

async function fetchAPI() {
    try {
        var url = API_SOURCES[apiIndex] + Date.now();
        var res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        
        if (json && json.data && json.data.list && json.data.list.length > 0) {
            var list = json.data.list;
            var nextIssue = (BigInt(list[0].issueNumber) + 1n).toString();
            
            if (currentPeriod !== nextIssue) {
                if (currentPeriod !== null && lastPredictedResult !== null) {
                    var actualResult = getType(parseInt(list[0].number));
                    if (actualResult !== lastPredictedResult) { isFlipped = !isFlipped; }
                }

                var aiAnalysis = analyzeMarketTrend(list);
                currentPeriod = nextIssue;
                currentPick = aiAnalysis.pick;
                currentPredictedNum = aiAnalysis.targetNum;
                lastPredictedResult = aiAnalysis.pick;
                isDataLoaded = true;

                if(isAuthenticated && (state === 'result' || state === 'ready')) {
                    state = 'result';
                    render();
                }
            }
        }
    } catch(e) { apiIndex = (apiIndex + 1) % API_SOURCES.length; }
}

function generateHGZYPeriod() { 
    const now = new Date(); 
    const baseTimeUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0); 
    const diffSeconds = Math.floor((Date.now() - baseTimeUTC) / 1000); 
    const interval = 30; 
    return { timeLeft: interval - (diffSeconds % interval) }; 
}

function numStyle(n){
  if([2, 4, 6, 8].includes(n)) return {bg:'linear-gradient(135deg, #cc0000, #440000)', br:'#ff3333'};
  if(n === 0) return {bg:'linear-gradient(135deg, #cc0000, #660066)', br:'#ff33cc'};
  if([1, 3, 7, 9].includes(n)) return {bg:'linear-gradient(135deg, #009944, #003311)', br:'#00ff66'};
  if(n === 5) return {bg:'linear-gradient(135deg, #009944, #660066)', br:'#00ffff'};
  return {bg:'linear-gradient(135deg, #003322, #000000)', br:'#00cc99'};
}

function updateEngine(){
  const p = generateHGZYPeriod();
  const rem = p.timeLeft;

  const col = rem<=5 ? '#ff3333' : rem<=10 ? '#ff9900' : '#86EFAC';
  const t = document.getElementById('tmr-display');
  if(t){
      t.textContent = '⏱ '+rem+'s';
      t.style.color = col;
  }
  if(rem <= 5) isDataLoaded = false;
}

function startEngine(){
  fetchAPI();
  setInterval(fetchAPI, 1000);
  updateEngine();
  setInterval(updateEngine, 1000);
}

function syncPos(from, to){
    var r = from.getBoundingClientRect();
    var w = to.offsetWidth || 300, h = to.offsetHeight || 270;
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var nx = cx - w/2;
    var ny = cy - h/2;
    to.style.transform='none';
    to.style.left = nx+'px';
    to.style.top  = ny+'px';
}

function openM() {
    if(isOpen) return;
    isOpen = true;

    var mini = document.getElementById('mini');
    var wrap = document.getElementById('main-wrapper');
    wrap.style.display = 'flex';
    document.getElementById('main').style.display = 'flex';
    requestAnimationFrame(function(){ syncPos(mini, wrap); mini.style.display='none'; });
    document.getElementById('dragon-icon').style.display = 'block';
    render();
}

function closeM(ev) {
    if(ev){ ev.stopPropagation(); ev.preventDefault(); }
    isOpen = false;

    var wrap = document.getElementById('main-wrapper');
    var mini = document.getElementById('mini');
    mini.style.display = 'flex';
    requestAnimationFrame(function(){ syncPos(wrap, mini); wrap.style.display='none'; });
    document.getElementById('dragon-icon').style.display = 'none';
    if(progressInterval) clearInterval(progressInterval);
    if(scanStatusInterval) clearInterval(scanStatusInterval);
}

function makeDraggable(el, handleSelector, onTap){
    var dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0, pid=null;
    var startTime=0;
    function onDown(e){
        if(handleSelector){
            var h = e.target.closest(handleSelector);
            if(!h || !el.contains(h)) return;
        }
        if(e.target.closest('button,.close-btn,.btn,input,a')) return;
        dragging=true; moved=false; startTime=Date.now();
        var r = el.getBoundingClientRect();
        el.style.transform='none';
        el.style.left = r.left+'px';
        el.style.top  = r.top+'px';
        ox = r.left; oy = r.top;
        sx = e.clientX; sy = e.clientY;
        pid = e.pointerId;
        try{ el.setPointerCapture(pid); }catch(_){}
        el.classList.add('dragging');
        e.preventDefault();
    }
    function onMove(e){
        if(!dragging) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
        var nx = ox + dx;
        var ny = oy + dy;
        el.style.left = nx+'px';
        el.style.top  = ny+'px';
    }
    function onUp(e){
        if(!dragging) return;
        dragging=false;
        el.classList.remove('dragging');
        try{ el.releasePointerCapture(pid); }catch(_){}
        var dt = Date.now()-startTime;
        if(!moved && dt < 400 && typeof onTap==='function'){ onTap(e); }
    }
    el.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
}

function initDrag(){
    var mini = document.getElementById('mini');
    var wrap = document.getElementById('main-wrapper');
    if(mini && !mini._dragInit){ mini._dragInit=true; makeDraggable(mini, null, function(){ openM(); }); }
    if(wrap && !wrap._dragInit){ wrap._dragInit=true; makeDraggable(wrap, '.drag-handle, .grip, #drag-header, .sys-bar, .title-text, #main'); }
}

/* ==================== ACTION CONTROL ==================== */
function actionClick() {
    if(!isAuthenticated) {
        unlock();
        return;
    }

    if(!isScanning) {
        state = 'scanning';
        render();
        startProgressTimer();
    }
}

function startProgressTimer() {
    if(progressInterval) clearInterval(progressInterval);
    if(scanStatusInterval) clearInterval(scanStatusInterval);

    var scanPhases = [
        'READING CHARTS FLOW',
        'FETCHING WINGO 30S API',
        'ANALYZING MARKET TREND',
        'FLIP COUNTER CHECK',
        'LOCKING TARGET NUMBER'
    ];
    var phaseIdx = 0;
    var setPhase = function(){
        var el = document.getElementById('scan-status');
        if(el) el.innerText = '> '+scanPhases[phaseIdx % scanPhases.length];
        phaseIdx++;
    };
    setPhase();
    scanStatusInterval = setInterval(setPhase, 500);

    var p = 0;
    progressInterval = setInterval(function() {
        p += 4;
        var pt = document.getElementById('prog-txt');
        var pf = document.getElementById('prog-fill');
        var pm = document.getElementById('prog-meta-pct');
        if(pt && pf) {
            pt.innerText = p + '%';
            pf.style.width = p + '%';
        }
        if(pm) pm.innerText = p + '%';
        if(p >= 100) {
            clearInterval(progressInterval);
            if(scanStatusInterval) clearInterval(scanStatusInterval);
            setTimeout(executeFinalCalculations, 200);
        }
    }, 50);
}

function executeFinalCalculations() {
    state = 'result';
    isScanning = false;
    render();
}

function buildDataStream(){
    var s='';
    var chars='01ABX#$%';
    for(var i=0;i<40;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    return s;
}
